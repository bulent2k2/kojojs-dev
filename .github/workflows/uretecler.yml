# Üretilmiş ve çoğaltılmış dosyalar kaynaklarıyla aynı mı.
#
# İki tür dosya var ve ikisi de aynı hataya açık -- "kopya kaynağından
# sessizce ayrıldı":
#   ÜRETİLMİŞ    bir betiğin çıktısı (OrnekDerlemeDeneme.scala,
#                YardimOrnekDerlemeDeneme.scala, sözlükteki gömülü YARDIM)
#   ÇOĞALTILMIŞ  başka bir yerden kopyalanmış satıcı dosyası
#                (src/test/resources/pixi.min.js <- lib/pixi5.min.js)
#
# NEDEN BU İŞ: bu depodaki birkaç dosya üretilmiş ama COMMIT'Lİ --
# OrnekDerlemeDeneme.scala, YardimOrnekDerlemeDeneme.scala, ve sözlük
# sayfasındaki gömülü YARDIM bloğu. Üretim adımı elle koşuluyor, yani
# kaynak değişip üretim unutulduğunda hiçbir şey hata vermiyor: ne test
# düşüyor ne sayfa bozuluyor, yalnız eski veri gösteriliyor.
#
# Eylül 2026'da tam bu oldu (yardim.json'daki türler alanı) ve fark ancak
# elle ölçünce görüldü. Bu iş o sınıfın tamamını yakalıyor.
#
# NEDEN SAF PYTHON: JVM, Scala.js ve tarayıcı gerektiren takım dakikalar
# sürüyor ve tarayıcı tarafı kırılgan (bkz. #51'deki "JS error" notu).
# Buradaki iş saniyeler sürüyor ve dış bağımlılığı yok -- yeşili anlamlı
# kalsın diye kasten dar tutuldu. Ağır takımlar ayrı bir adımda konuşuluyor.
#
# ESKİDEN KAPSANMAYAN, ARTIK KAPSANAN: gösteri satırları (döndür, büyüt,
# Resim.daire, ...) eskiden yalnız kojojs-editor'daki sayfaya ELLE
# yapıştırılıyordu, bu depoda bir dosyaya yazılmıyordu; bir gösterinin
# AÇIKLAMASI değişse burada hiçbir şey kırmızı yanmazdı. Artık kilavuz/
# uret.py o bölümü `<!-- gösteriler -->` işaretinden üretiyor ve çıktısı
# kilavuz/html/komutlar.html'e düşüyor, yani aşağıdaki adımla izleniyor.
#
# KAPSAMADIĞI: kojojs-editor'daki Twirl şablonunun kendisi. Onu üretmek
# --twirl ile öbür deponun ağacına yazmak demek; CI depolar arasını
# göremiyor. Yani burada yeşil olması editördeki sayfanın taze olduğunu
# SÖYLEMEZ; iki depo elle eşleniyor.
name: üreteçler

# push YALNIZ master'da: dal itmelerini zaten pull_request tetikliyor, ikisi
# birden açıkken her PR itmesi işi İKİ KEZ koşturuyordu (ölçüldü: aynı
# commit'te iki özdeş check run). master'daki push ise birleşme sonrasını
# kapsıyor -- PR'da yeşil olup birleşmede bozulan bir şey olursa görünsün.
on:
  push:
    branches: [master]
  pull_request:

# İş yalnız okuyor; token'ı en az yetkide sabitle -- deponun varsayılanı
# ileride değişse de bu iş etkilenmesin.
permissions:
  contents: read

jobs:
  uretilmis-dosyalar:
    name: üretilmiş ve çoğaltılmış dosyalar tazeyken mi
    runs-on: ubuntu-latest
    env:
      # Türkçe adlar ve içerik var; UTF-8 bu depoda kozmetik değil.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      # Action'lar MAJOR etiketine sabitleniyor (SHA'ya değil): güvenlik
      # yamalarını kendiliğinden alsınlar, kırıcı değişiklik ise major
      # atlarken bilinçli olsun. GitHub eskiyen çalışma zamanını (bugün
      # Node) iş günlüğünde uyarı olarak duyuruyor -- o uyarı çıktığında
      # buradaki ikisi birden tazelenmeli, yoksa bir gün zorla yükseltilir.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Bu denetim hiçbir şeye bağlı değil ve ağacı değiştirmiyor, o yüzden
      # önce: üreteç adımlarından biri alakasız bir sebeple düşerse bunun
      # hiç koşmaması boşuna olurdu.
      #
      # Test harnessi ile kütüphanedeki PIXI aynı DOSYA olmalı. #52'nin
      # gözcüsü (BoyaTest: "test harnessi PIXI 4'e geri kaymamış") sürümün
      # 5+ olmasını denetliyor; bu, kütüphane 5.4'e geçip harness 5.3.12'de
      # kalırsa sessiz kalırdı -- yani #52'nin kapattığı hatanın bir sonraki
      # sürümü. lib/pixi5.min.js izlenen bir dosya (run5.html onu yüklüyor).
      #
      # SINIRI: bu, harness'i lib'e bağlıyor; asıl değişmez ise harness'in
      # SİTENİN sunduğu PIXI'yi koşması. Editör tek başına yükselirse burası
      # yeşil kalır -- depolar arası, ayrı bir iş.
      - name: test harnessindeki PIXI kütüphanedekiyle aynı mı
        run: |
          if ! cmp src/test/resources/pixi.min.js lib/pixi5.min.js; then
            echo "::error::src/test/resources/pixi.min.js ile lib/pixi5.min.js ayrışmış."
            echo "Testler sitenin sunduğundan başka bir PIXI koşuyor demektir."
            echo "Tazelemek için:  cp lib/pixi5.min.js src/test/resources/pixi.min.js"
            exit 1
          fi

      # PIXI'nin başına gelen libtess'e gelmesin: kütüphane iki yerde duruyor
      # ve ayrışırsa sınamalar sayfanınkinden başka bir libtess koşar.
      - name: test harnessindeki libtess kütüphanedekiyle aynı mı
        run: |
          if ! cmp src/test/resources/libtess.cat.js lib/libtess.cat.js; then
            echo "::error::src/test/resources/libtess.cat.js ile lib/libtess.cat.js ayrışmış."
            echo "Tazelemek için:  cp lib/libtess.cat.js src/test/resources/libtess.cat.js"
            exit 1
          fi

      # libtess'i yükleyen HER sayfa yüklemeye devam etsin. Dolgu sarım kuralı
      # buna bağlı: kütüphane yoksa Üçgenleyici çalışmaz ve kendini kesen
      # yollar sessizce yanlış dolar (bkz. oneri-kesisen-dolgu.md).
      - name: libtess'i yükleyen sayfalar eksiksiz mi
        run: |
          eksik=0
          for sayfa in run.html run5.html; do
            if ! grep -q "libtess.cat.js" "$sayfa"; then
              echo "::error::$sayfa libtess.cat.js yüklemiyor."
              eksik=1
            fi
          done
          # Ayrı depodaki editör sayfası (kojojs-editor) BURADAN GÖRÜLMÜYOR:
          # resultframe.scala.html de libtess yüklemeli, yoksa CANLI SİTE
          # kütüphanesiz kalır. CI depolar arasını göremiyor -- elle izlenecek.
          exit $eksik

      # kojojs-core'a giden paket listesi elle tutuluyor: yeni bir üst düzey
      # paket eklenip listeye yazılmazsa senkron sessizce eksik kopyalar ve
      # core DERLENMEZ. #65'te tam bu oldu (libtessjs). Asıl senkron Faz 3'e
      # kadar kilitli olduğu için liste yıllarca hiç koşmayabilirdi; --denetle
      # kipi kilitten bağımsız ve saniyeler sürüyor.
      - name: çalışma zamanı paketleri senkron listesinde mi
        run: ./sync-kojojs-core.sh --denetle

      # Betiklerin kendi savları: yardim.json beklenen alanları taşıyor mu
      # (üretim bunun üzerine kuruluyor), ve her zrc gidiş-dönüş sınanıyor.
      - name: gösteri ve yardım örneklerini yeniden üret
        run: |
          python3 araclar/gosteri-uret.py --scala
          python3 araclar/yardim-derleme-uret.py

      # Kılavuz sayfaları da üretilmiş ve commit'li: kilavuz/html/*.html ve
      # kilavuz/eksik-adlar.tsv. Kaynak kilavuz/{komutlar,skala}/*.md ve --
      # "Resim komutları" bölümü için -- araclar/gosteri-uret.py'deki G
      # çizelgesi. Bu adım olmadan G'ye bir gösteri eklemek ya da markdown'ı
      # değiştirmek sayfayı SESSİZCE bayatlatırdı: ne test düşer ne sayfa
      # bozulur, yalnız eski içerik gösterilir -- bu işin kovaladığı hatanın
      # ta kendisi.
      #
      # Koşucuda masaüstü kojo klonu YOK; uret.py o durumda izlenen
      # kilavuz/masaustu-adlar.txt önbelleğini OKUYOR (yazmıyor -- yazma yolu
      # yalnız klon bulununca çalışıyor). Ölçüldü: klonsuz koşuda ağaç temiz
      # kalıyor. Klonu olan bir geliştirici yerelde koşarsa önbellek
      # tazelenebilir; o fark commit'lenince CI yine aynı çıktıyı üretir.
      - name: kılavuz sayfaları yeniden üret
        run: python3 kilavuz/uret.py

      - name: sözlükteki gömülü YARDIM bloğu yardim.json ile aynı mı
        run: python3 araclar/sozluk-denetle.py

      # Sözlüğün key:"val" tablosu ELLE tutulan HTML: kodda bir renk adı
      # eklenip tabloya yansıtılmazsa hiçbir şey hata vermez, sayfa sessizce
      # eski veriyi gösterir. Eylül 2026'da tam bu oldu -- koddaki 39 ada
      # karşılık sözlükte 6 satır vardı ve ancak elle sayınca görüldü (#58).
      - name: sözlükteki renk satırları Renkler ile aynı mı
        run: python3 araclar/sozluk-renk-denetle.py


      # ikojo, masaüstünün anlık görüntüsündeki adları KAYBETMEMELİ.
      #
      # Neden anlık görüntü: koşucuda masaüstü klonu yok. Tam karşılaştırma
      # (araclar/adlar.py --kojo <klon>) yerelde koşuyor; buradaki adım onun
      # yazdığı izlenen TSV'ye bakıyor.
      #
      # SINIRI açık olsun: bu, ikojo'nun GERİLEMESİNİ yakalar. Masaüstünün
      # YENİ bir ad eklemesini yakalayamaz -- yeni ad anlık görüntüde de yok.
      # Onun için tam karşılaştırmayı elle koşmak gerekiyor.
      - name: ikojo masaüstünün anlık görüntüsünün gerisine düşmemiş mi
        run: python3 araclar/adlar.py --anlik-goruntu

      # Asıl sav: yeniden üretim ağaçtakini DEĞİŞTİRMEMELİ.
      #
      # `git diff --exit-code` DEĞİL: o izlenmeyen dosyayı görmüyor (ölçüldü).
      # Bir üreteç YENİ bir çıktı dosyası kazanırsa -- ya da bir hedefin adı
      # değişip eskisi izlenmeye devam ederse -- yeni dosya commit'lenmese
      # bile iş yeşil yanardı; yani tam da bu işin koruduğu değişmezin bir
      # dilimi açık kalırdı. --porcelain ikisini birden görüyor.
      - name: üretilenler ağaçtakiyle aynı mı
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Üretilmiş dosyalar kaynağıyla uyuşmuyor (yukarıda)."
            echo "Yerelde şunları koşup çıkan farkı commit'leyin:"
            echo "  araclar/gosteri-uret.py --scala"
            echo "  araclar/yardim-derleme-uret.py"
            echo "  python3 kilavuz/uret.py"
            exit 1
          fi
