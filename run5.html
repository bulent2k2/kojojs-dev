<!-- DİKKAT (kaynak haritası): pixi5.min.js'in içine gömülü işaret

     kopyadır (kojojs-editor/sync-lib.sh); tarayıcı onu kendiliğinden bulmaz.
     Gerekirse devtools'tan elle bağlanır. Gömülü işareti değiştirmek satıcı
     dosyasını düzenlemek olurdu, ondan kaçınıyoruz. -->
